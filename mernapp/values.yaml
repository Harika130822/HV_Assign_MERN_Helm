registry: public.ecr.aws/l5r9g0t4
tag: latest

helloService:
  name: hello-service
  image: mern/hello
  replicas: 1
  port: 3001

profileService:
  name: profile-service
  image: mern/profile
  replicas: 1
  port: 3002

frontend:
  name: frontend
  image: mern/frontend
  replicas: 1
  port: 80

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  name: my-service-account

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  name: my-ingress
  enabled: true
  host: myapp.example.com