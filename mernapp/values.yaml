helloService:
  name: hello-service
  image: myrepo/hello-service:latest
  replicas: 2
  port: 3001

profileService:
  name: profile-service
  image: myrepo/profile-service:latest
  replicas: 2
  port: 3002
  mongoUrl: "specifyYourMongoURLHereWithDatabaseNameInTheEnd"

frontend:
  name: frontend
  image: myrepo/frontend:latest
  replicas: 1
  port: 80

serviceAccount:
  name: my-service-account

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  host: myapp.example.com