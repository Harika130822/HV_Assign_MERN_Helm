apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.helloService.name }}
  labels:
    app: {{ .Values.helloService.name }}
spec:
  replicas: {{ .Values.helloService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.helloService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.helloService.name }}
    spec:
      containers:
      - name: {{ .Values.helloService.name }}
        image: {{ .Values.helloService.image }}
        ports:
        - containerPort: {{ .Values.helloService.port }}
        env:
        - name: PORT
          value: "{{ .Values.helloService.port }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.profileService.name }}
  labels:
    app: {{ .Values.profileService.name }}
spec:
  replicas: {{ .Values.profileService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.profileService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.profileService.name }}
    spec:
      containers:
      - name: {{ .Values.profileService.name }}
        image: {{ .Values.profileService.image }}
        ports:
        - containerPort: {{ .Values.profileService.port }}
        env:
        - name: PORT
          value: "{{ .Values.profileService.port }}"
        - name: MONGO_URL
          value: "{{ .Values.profileService.mongoUrl }}"
---
